name: Build apps

# Run manually from the Actions tab (tick "release" to publish one), or push a tag like v1.0.0.
on:
  workflow_dispatch:
    inputs:
      ios_upload:
        description: Upload the iOS build to TestFlight
        type: boolean
        default: false
      release:
        description: Publish a GitHub Release tagged v<package.json version>, with the signed APK
        type: boolean
        default: false
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  VERSION_CODE: ${{ github.run_number }}

jobs:
  checks:
    name: Checks (lint, types, unit tests, offline cache list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Offline cache list is up to date
        run: |
          node scripts/gen-sw.mjs
          git diff --exit-code sw.js || (echo "Run: node scripts/gen-sw.mjs" && exit 1)

  e2e:
    name: Browser tests (journeys, languages, accessibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  visual:
    name: Visual regression (screens and sheets, 3 languages)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The baselines are rendered with these fonts; the test names them, so no other fallback is used.
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-core fonts-noto-color-emoji
      - run: npm run test:visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: visual-diffs, path: tests/visual/out/, retention-days: 14 }

  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    # A step's `if` cannot read that step's own env, so whether the signing key exists is
    # decided here, once, for the whole job.
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      # Cache Gradle downloads: without it every run fetches the whole dependency tree from Maven
      # Central, which rate-limits busy CI runners (HTTP 429) and fails the build.
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: gradle, cache-dependency-path: 'android/**/*.gradle*' }
      - run: npm ci
      - run: npm run build:web && npx cap sync android
      - name: Restore signing key
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env: { KEYSTORE: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks" && echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          [ -n "$VERSION_NAME" ] || export VERSION_NAME="$(node -p "require('../package.json').version")"
          ./gradlew assembleRelease bundleRelease --no-daemon
      # A version tag publishes a release, and an unsigned APK cannot be installed: stop here
      # with instructions instead of publishing one.
      - name: Check release signing
        if: ${{ github.ref_type == 'tag' || inputs.release }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$GITHUB_REF_NAME built an unsigned APK. Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets (see docs/SETUP.md, "Signed releases")."
            exit 1
          fi
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: revive-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

  windows:
    name: Windows (installer + Store package)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Build
        working-directory: desktop
        shell: bash
        env:
          APPX_IDENTITY: ${{ secrets.MS_STORE_IDENTITY_NAME }}
          APPX_PUBLISHER: ${{ secrets.MS_STORE_PUBLISHER }}
        run: |
          npm ci
          TARGETS="nsis"
          EXTRA=""
          if [ -n "$APPX_IDENTITY" ] && [ -n "$APPX_PUBLISHER" ]; then
            TARGETS="nsis appx"
            EXTRA="-c.appx.identityName=$APPX_IDENTITY -c.appx.publisher=$APPX_PUBLISHER"
          fi
          npm run prepare-web
          npx electron-builder --win $TARGETS --x64 --publish never $EXTRA
      - name: Verify installer on Windows
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/dist/Revive-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Revive\Revive.exe'
          if (-not (Test-Path $exe)) { Write-Error "Revive.exe not installed"; exit 1 }
          Write-Output "Installed: $exe"
      - uses: actions/upload-artifact@v4
        with:
          name: revive-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.appx

  ios-compile:
    name: iOS (compile check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build:web && npx cap sync ios
      - name: Build for simulator (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0

  ios:
    name: iOS (IPA / TestFlight)
    runs-on: macos-latest
    # Needs an Apple Developer account. Skipped until the App Store Connect key is added.
    if: ${{ vars.IOS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build:web && npx cap sync ios
      - name: App Store Connect key
        env: { ASC_KEY: '${{ secrets.ASC_KEY_P8_BASE64 }}' }
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      - name: Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Revive.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} archive
      - name: Export (and upload to TestFlight if chosen)
        run: |
          DEST=export
          if [ "${{ inputs.ios_upload }}" = "true" ] || [ "${{ github.ref_type }}" = "tag" ]; then DEST=upload; fi
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Revive.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
      - uses: actions/upload-artifact@v4
        with: { name: revive-ios, path: '${{ runner.temp }}/ipa' }

  release:
    name: GitHub release
    if: ${{ github.ref_type == 'tag' || inputs.release }}
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      # Tag v<version> (from package.json, or the pushed tag) and use that version's changelog entry as the notes.
      - id: meta
        run: |
          V="$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_TYPE" = tag ] && V="${GITHUB_REF_NAME#v}"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::CHANGELOG.md has no '## $V' entry"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Revive ${{ steps.meta.outputs.tag }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            artifacts/revive-android/**/app-release.apk
            artifacts/revive-android/**/*.aab
            artifacts/revive-windows/*.exe
            artifacts/revive-windows/*.appx
