name: Build apps

# Run manually from the Actions tab, or push a tag like v1.0.0 to publish a release.
on:
  workflow_dispatch:
    inputs:
      ios_upload:
        description: Upload the iOS build to TestFlight
        type: boolean
        default: false
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  VERSION_CODE: ${{ github.run_number }}

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - run: npm run build:web && npx cap sync android
      - name: Restore signing key
        if: ${{ env.KEYSTORE != '' }}
        env: { KEYSTORE: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks" && echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: revive-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

  windows:
    name: Windows (installer + Store package)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Build
        working-directory: desktop
        shell: bash
        env:
          APPX_IDENTITY: ${{ secrets.MS_STORE_IDENTITY_NAME }}
          APPX_PUBLISHER: ${{ secrets.MS_STORE_PUBLISHER }}
        run: |
          npm ci
          TARGETS="nsis"
          EXTRA=""
          if [ -n "$APPX_IDENTITY" ] && [ -n "$APPX_PUBLISHER" ]; then
            TARGETS="nsis appx"
            EXTRA="-c.appx.identityName=$APPX_IDENTITY -c.appx.publisher=$APPX_PUBLISHER"
          fi
          npm run prepare-web
          npx electron-builder --win $TARGETS --x64 --publish never $EXTRA
      - name: Verify installer on Windows
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/dist/Revive-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Revive\Revive.exe'
          if (-not (Test-Path $exe)) { Write-Error "Revive.exe not installed"; exit 1 }
          Write-Output "Installed: $exe"
      - uses: actions/upload-artifact@v4
        with:
          name: revive-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.appx

  ios-compile:
    name: iOS (compile check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build:web && npx cap sync ios
      - name: Build for simulator (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0

  ios:
    name: iOS (IPA / TestFlight)
    runs-on: macos-latest
    # Needs an Apple Developer account. Skipped until the App Store Connect key is added.
    if: ${{ vars.IOS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build:web && npx cap sync ios
      - name: App Store Connect key
        env: { ASC_KEY: '${{ secrets.ASC_KEY_P8_BASE64 }}' }
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      - name: Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Revive.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} archive
      - name: Export (and upload to TestFlight if chosen)
        run: |
          DEST=export
          if [ "${{ inputs.ios_upload }}" = "true" ] || [ "${{ github.ref_type }}" = "tag" ]; then DEST=upload; fi
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Revive.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
      - uses: actions/upload-artifact@v4
        with: { name: revive-ios, path: '${{ runner.temp }}/ipa' }

  release:
    name: GitHub release
    if: ${{ github.ref_type == 'tag' }}
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/revive-android/**/*.apk
            artifacts/revive-android/**/*.aab
            artifacts/revive-windows/*.exe
            artifacts/revive-windows/*.appx
